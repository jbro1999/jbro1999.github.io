:root{--p:#4b1d7a;--p2:#6a2fb0;--l:#efe7fa;--g:#f2c230}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--l);color:#222}

.kids{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:16px;max-width:1100px;margin:auto}
.kid{border:3px solid var(--p);background:#fff;color:var(--p);border-radius:16px;padding:14px;font-size:1.25em;font-weight:700;cursor:pointer;text-align:center}
.kid .n{font-size:1.8em;display:block}.kid small{display:block;font-weight:500;font-size:.7em;color:#555;margin-top:4px}
.kid.on{background:var(--p);color:#fff}.kid.on small{color:#e6d8ff}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 16px 12px}
.bar button,.bar select{font-size:1em;padding:10px 16px;border-radius:999px;border:2px solid var(--p);background:#fff;color:var(--p);font-weight:600}
.bar button.on{background:var(--p);color:#fff}
.sum{text-align:center;font-weight:600;color:var(--p);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:0 16px 30px;max-width:1100px;margin:auto}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #4b1d7a22;cursor:pointer}
.card .top{background:var(--p);color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
.tag{background:var(--g);color:#222;border-radius:6px;padding:2px 8px;font-size:.85em;font-weight:700}.tag.a{background:#cdb6f0}
.card .b{padding:10px 12px}.card .opp{font-weight:700;font-size:1.05em}.card .meta{color:#666;font-size:.9em;margin-top:4px}
.card video{width:100%;display:block;background:#000}.play{color:var(--p2);font-weight:600;margin-top:6px}
.blades{--p:#0B1F4B;--p2:#1a3570;--l:#eef1f8;--g:#C9A227}.blades .tag.a,.tag.a.bl{background:#e9d9a0}.kid.blades.on small{color:#f3e3a8}.kid.blades{border-color:#C9A227}body.blades header{border-bottom:4px solid #C9A227}.empty{grid-column:1/-1;text-align:center;color:#777;padding:30px}.teams{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:6px 12px}.tp{background:#fff;border:2px solid var(--p);border-radius:12px;padding:10px 14px;min-width:220px}.tp h3{margin:0 0 4px;color:var(--p);font-size:15px}.tp .r{font-size:22px;font-weight:700}.tp .m{font-size:12px;color:#555}.ng{margin-top:8px;border-top:1px solid #ddd;padding-top:6px;font-size:13px}.ng>b{color:var(--p)}.gm{padding:5px 0;border-bottom:1px dashed #e3e3e3}.gm:last-child{border:0}.ha{background:var(--g);border-radius:5px;padding:0 6px;font-size:11px;font-weight:700}.mhr{color:inherit;text-decoration:none;display:block}.mhr:hover .r,.mhr:hover .m{text-decoration:underline}.res{font-weight:700;padding:0 5px;border-radius:4px}.res.W{background:#cfeccf;color:#145214}.res.L{background:#f6d0d0;color:#7a1414}.res.T{background:#e6e6e6;color:#333}.upd{width:100%;text-align:center;font-size:11px;color:#777}html,body{overflow-x:hidden;-webkit-text-size-adjust:100%}.tp,.card,.gm,.m{overflow-wrap:anywhere}img,video{max-width:100%}
@media (max-width:600px){body{font-size:16px}header{padding:14px 12px;padding-top:max(14px,env(safe-area-inset-top))}header h1{font-size:1.35em}
.kids{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;gap:10px;padding:12px}
.kid{flex:0 0 auto;min-width:140px;min-height:56px;scroll-snap-align:start;font-size:1.05em;padding:10px 12px}
.teams{flex-direction:column;padding:6px 12px}.tp{min-width:0;width:100%}.tp h3{font-size:16px}.tp .m,.ng{font-size:14px}
.bar{padding:0 12px 10px}.bar button,.bar select{min-height:44px;font-size:16px;flex:1 1 auto}
.grid{grid-template-columns:1fr;padding:0 0 24px;gap:12px}.card{border-radius:0}.card video{width:100%}.play{padding:10px 0;font-size:1.05em}}

<script>
const C=JSON.parse(document.getElementById('data').textContent);
const KIDS=[['Chase',9],['Cooper',21],['Hudson',16],['Carson',15]];
const AGE=k=>KIDS.findIndex(x=>x[0]==k);
const FULL={Cooper:'Cooper Brosius',Hudson:'Hudson Brosius',Carson:'Carson Baginski',Chase:'Chase Baginski'};
const BLADES=k=>k=='Chase';
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const S=JSON.parse(document.getElementById('stats').textContent);
function teams(){const el=document.getElementById('teams');const T=S.teams||{};const ks=st.kid=='All'?KIDS.map(x=>x[0]).filter(k=>T[k]):[st.kid].filter(k=>T[k]);
 el.innerHTML=ks.map(k=>{const t=T[k];return `<div class="tp${BLADES(k)?' blades':''}"><h3>${FULL[k]} · ${t.team}</h3><a class="mhr" href="https://myhockeyrankings.com/team-info/${t.mhr_id}/2026" target="_blank" rel="noopener"><div class="r">${t.record} <span class="m">W-L-T</span></div><div class="m">MHR rating ${t.rating} · ${t.rank}</div></a><div class="m">GF-GA ${t.gf_ga} · ${t.division}</div>${ng(t.next_games,st.kid=='All')}${rr(t.recent_results,st.kid=='All')}</div>`}).join('')+(ks.length?`<div class="upd">Updated ${S.updated} · MyHockeyRankings</div>`:'')}
function rr(G,c){G=G||[];if(!G.length)return '';return '<div class="ng"><b>Recent results</b>'+(c?G.slice(0,2):G.slice(0,3)).map(g=>`<div class="m">${g.day} · ${g.home_away=='Away'?'@':'vs'} ${g.opponent} · <span class="res ${g.result}">${g.result} ${g.score}</span></div>`).join('')+'</div>'}
function ng(G,c){G=G||[];let h='<div class="ng"><b>Next games</b>';if(!G.length)return h+'<div class="m">No upcoming games posted</div></div>';(c?G.slice(0,2):G).forEach(g=>{h+=c?`<div class="m">${g.day} ${g.time} · ${g.home_away=='Away'?'@':'vs'} ${g.opponent}${g.rink?' · '+g.rink:''}</div>`:`<div class="gm"><div><b>${g.day} · ${g.time} ET</b> <span class="ha">${g.home_away}</span></div><div>${g.home_away=='Away'?'@':'vs'} ${g.opponent}</div><div class="m">${g.rink}</div></div>`});return h+'</div>'}
let st={kid:'All',type:'All',yr:'All',mo:'All'};
function season(d){const[y,m]=d.split('-').map(Number);return m>=8?y:y-1}
const curS=season(new Date().toISOString().slice(0,10));
function fmt(d){const[y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'})}
function kids(){const k=document.getElementById('kids');k.innerHTML='';
 [['All',''],...KIDS].forEach(([n,num])=>{const s=C.filter(c=>(n=='All'||c.kid==n)&&season(c.date)==curS);
  const g=s.filter(c=>c.type=='Goal').length,a=s.filter(c=>c.type=='Assist').length;
  const b=document.createElement('button');b.className='kid'+(BLADES(n)?' blades':'')+(st.kid==n?' on':'');
  b.innerHTML=`<span class="n">${num?'#'+num:'★'}</span>${n=='All'?'All Boys':FULL[n]}<small>${curS}-${String(curS+1).slice(2)}: ${g} G · ${a} A</small>`;
  b.onclick=()=>{st.kid=n;render()};k.appendChild(b)})}
function types(){const t=document.getElementById('types');t.innerHTML='';
 [['All','All'],['Goal','Goals'],['Assist','Assists']].forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.className=st.type==v?'on':'';b.onclick=()=>{st.type=v;render()};t.appendChild(b)})}
function sel(){const yr=document.getElementById('yr'),mo=document.getElementById('mo');
 const ys=[...new Set(C.map(c=>c.date.slice(0,4)))].sort().reverse();
 yr.innerHTML='<option value="All">All years</option>'+ys.map(y=>`<option>${y}</option>`).join('');
 mo.innerHTML='<option value="All">All months</option>'+MON.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('');
 yr.onchange=()=>{st.yr=yr.value;render()};mo.onchange=()=>{st.mo=mo.value;render()}}
function render(){document.body.className=BLADES(st.kid)?'blades':'';document.getElementById('sub').innerHTML=st.kid=='All'?'Niagara Jr Purple Eagles &amp; Wheatfield Blades':BLADES(st.kid)?'Wheatfield Blades':'Niagara Jr Purple Eagles';kids();teams();types();const g=document.getElementById('grid');
 const L=C.filter(c=>(st.kid=='All'||c.kid==st.kid)&&(st.type=='All'||c.type==st.type)&&(st.yr=='All'||c.date.slice(0,4)==st.yr)&&(st.mo=='All'||c.date.slice(5,7)==st.mo)).sort((a,b)=>b.date.localeCompare(a.date)||AGE(a.kid)-AGE(b.kid));
 document.getElementById('sum').textContent=`${L.length} clip${L.length==1?'':'s'} · ${L.filter(c=>c.type=='Goal').length} goals · ${L.filter(c=>c.type=='Assist').length} assists`;
 g.innerHTML=L.length?'':'<div class="empty">No clips for this filter yet.</div>';
 L.forEach(c=>{const d=document.createElement('div');d.className='card'+(BLADES(c.kid)?' blades':'');
  const per=[c.period&&c.period+' period',c.clock&&c.clock].filter(Boolean).join(' · ');
  d.innerHTML=`<div class="top"><b>${FULL[c.kid]||c.kid} #${c.number}</b><span class="tag ${c.type=='Assist'?'a':''}">${c.gwg?'GWG':c.type}</span></div>
  <div class="vid"></div><div class="b"><div class="opp">${c.home_away=='at'?'@':'vs'} ${c.opponent}</div>
  <div class="meta">${fmt(c.date)}${c.rink?' · '+c.rink:''}</div>${per?`<div class="meta">${per}</div>`:''}${c.note?`<div class="meta">${c.note}</div>`:''}
  <div class="play">▶ Tap to play</div></div>`;
  d.onclick=()=>{const v=d.querySelector('.vid');if(v.firstChild)return;v.innerHTML=`<video src="${c.file}" controls autoplay playsinline></video>`;d.querySelector('.play').remove()};
  g.appendChild(d)})}
sel();render();
</script></body></html>
